# Builds the addon zip and uploads it to CurseForge when a tag is pushed.
# The tag name is the version (e.g. 1.2.1, no "v"); a tag containing "alpha" or "beta"
# is uploaded as such, anything else as a release. Needs the repository secret
# NIGHTSFARMTRACKER (GITHUB_TOKEN is provided by GitHub). The project ID comes from the TOC.
name: Package and release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.NIGHTSFARMTRACKER }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog of this version only
        # CurseForge shows CHANGELOG.md; cut it down to the section of the tag
        # (1.2.1 -> "## 1.2.1", 1.3.0-alpha2 -> "## 1.3.0 (alpha 2)").
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^(.+)-(alpha|beta)([0-9]+)$ ]]; then
            heading="## ${BASH_REMATCH[1]} (${BASH_REMATCH[2]} ${BASH_REMATCH[3]})"
          else
            heading="## ${tag}"
          fi
          # (CRLF stripped first: .gitattributes checks the file out with CRLF.)
          # From the heading to the next "---" line or the next "## " heading, whichever comes first.
          tr -d '\r' < CHANGELOG.md | awk -v h="$heading" '$0 == h {on=1; print; next} on && (/^---/ || /^## /) {exit} on' > CHANGELOG.cut
          if [ ! -s CHANGELOG.cut ]; then
            echo "::error::No section '$heading' in CHANGELOG.md"
            exit 1
          fi
          mv CHANGELOG.cut CHANGELOG.md
          cat CHANGELOG.md

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          # File name and CurseForge label: NightsFarmtracker_<tag> (e.g. NightsFarmtracker_1.7.6).
          args: -n "{package-name}_{project-version}:{package-name}_{project-version}"

      - name: Post changelog to Discord
        # Posts this version's changelog section to #releases. Skipped while the repository
        # secret DISCORD_RELEASES (Discord webhook URL) is not set; a failed post does not fail the release.
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          # CHANGELOG.md was cut down to this tag's section above; drop its heading and leading blank lines.
          body=$(tail -n +2 CHANGELOG.md | sed '/./,$!d')
          # Embed descriptions are limited to 4096 characters.
          if [ ${#body} -gt 3800 ]; then body="${body:0:3800}"$'\n…'; fi
          jq -n \
            --arg title "${GITHUB_REPOSITORY#*/} ${GITHUB_REF_NAME}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg desc "$body" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 5793266}]}' > discord.json
          curl -fsS -H "Content-Type: application/json" -d @discord.json "$DISCORD_WEBHOOK"
